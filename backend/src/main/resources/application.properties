spring.application.name=2409-academy-api
server.port=${PORT:8080}

# ---------------------------------------------------------------
# PostgreSQL connection  (database: 2409_academy, table: users)
# Each value can be overridden with an environment variable.
#
# >>> If PostgreSQL 18 is NOT on port 5433 (e.g. you also have
# >>> PostgreSQL 16 installed, so 18 may use 5433), change 5433 below.
# >>> Check: pgAdmin -> PostgreSQL 18 -> Properties -> Connection -> Port
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/2409_academy}
spring.datasource.username=${DB_USERNAME:postgres}
# >>> Must be the password of the "postgres" user on the SAME server as the port above.
spring.datasource.password=${DB_PASSWORD:newpassword123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Validate the existing users table; never recreate or delete it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Use a long random secret in production; this default is for local development only.
app.jwt.secret=${APP_JWT_SECRET:local-dev-secret-change-this-to-a-random-32-character-minimum}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
